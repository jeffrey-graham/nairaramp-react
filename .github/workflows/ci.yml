name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20, 22]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      - name: Test
        run: pnpm test

      - name: Verify "use client" in dist bundles
        run: |
          node -e '
            const fs = require("fs");
            const path = require("path");
            const dist = path.join(process.cwd(), "dist");
            const files = fs.readdirSync(dist).filter(f => f.endsWith(".js") || f.endsWith(".cjs"));
            if (files.length === 0) {
              console.error("No .js or .cjs files found in dist");
              process.exit(1);
            }
            for (const f of files) {
              const content = fs.readFileSync(path.join(dist, f), "utf8");
              const firstLine = content.split(/\r?\n/)[0].trim();
              if (firstLine !== "\"use client\";" && firstLine !== "\x27use client\x27;") {
                console.error(`Missing "use client" in ${f}; found: ${firstLine}`);
                process.exit(1);
              }
              console.log(`Verified "use client" in ${f}`);
            }
          '

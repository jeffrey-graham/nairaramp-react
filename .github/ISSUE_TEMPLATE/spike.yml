name: Spike Investigation
description: Propose a research spike or technical investigation for @nairaramp/react
labels: ["spike"]
body:
  - type: textarea
    id: question
    attributes:
      label: Question to answer
      description: What primary question or hypothesis are we testing?
    validations:
      required: true
  - type: textarea
    id: what-to-investigate
    attributes:
      label: What to investigate
      description: What approaches, libraries, or architectures need exploration?
    validations:
      required: true
  - type: textarea
    id: expected-output
    attributes:
      label: Expected output
      description: What concrete deliverables (e.g. decision doc, proof-of-concept, recommendations) should this spike produce?
    validations:
      required: true
